<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盤點校正</title>
  <style>
    :root { --primary: #1d4ed8; --bg: #f8fafc; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --danger: #dc2626; --success: #16a34a; }
    body { margin: 0; padding: 96px 16px 120px; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 40%, #f8fafc 100%); color: var(--text); }
    h1 { margin: 0 0 12px; text-align: center; font-size: 1.8rem; font-weight: 900; }
    .sub { max-width: 1180px; margin: 0 auto 16px; color: var(--muted); font-weight: 700; text-align: center; }
    .top-dock, .panel, .table-wrap { background: rgba(255,255,255,0.95); border: 1px solid rgba(226,232,240,0.9); box-shadow: 0 12px 30px rgba(15,23,42,0.08); backdrop-filter: blur(8px); }
    .top-dock { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); width: min(calc(100% - 24px), 1180px); padding: 8px 10px; border-radius: 16px; z-index: 900; box-sizing: border-box; }
    .top-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .top-nav a { flex: 0 0 auto; white-space: nowrap; text-decoration: none; color: #334155; background: #e2e8f0; border: 1px solid #cbd5e1; padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; }
    .top-nav a.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .layout { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 16px; }
    .panel { border-radius: 18px; padding: 16px; }
    .section-title { font-weight: 900; margin: 0 0 12px; font-size: 1.05rem; }
    .hint { font-size: 0.9rem; color: var(--muted); margin: -4px 0 12px; font-weight: 700; }
    .toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; }
    label { display: block; font-size: 0.9rem; font-weight: 900; margin: 10px 0 6px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 15px; background: #fff; color: #111827; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.12); }
    .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 900; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .status-box { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; font-size: 0.9rem; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .table-wrap { border-radius: 18px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    thead th { position: sticky; top: 0; background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left; padding: 12px 10px; color: #334155; font-size: 13px; }
    tbody td { border-bottom: 1px solid #f1f5f9; padding: 10px; vertical-align: top; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .diff-plus { color: var(--success); font-weight: 900; }
    .diff-minus { color: var(--danger); font-weight: 900; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .summary-item { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .summary-item .k { font-size: 12px; color: var(--muted); font-weight: 800; }
    .summary-item .v { font-size: 1rem; font-weight: 900; margin-top: 4px; }
    @media (max-width: 960px) { .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } .toolbar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="top-dock"><div id="topNav" class="top-nav"></div></div>
  <h1>盤點校正</h1>
  <div class="sub">這一頁只處理盤點差異，不跟移轉混在一起。先載入帳面資料，再讓盤點人補實盤數。</div>

  <div class="layout">
    <section class="panel">
      <div class="section-title">1. 盤點控制</div>
      <div class="status-box">
        <div>盤點狀態：<span id="lockState">讀取中...</span></div>
        <div id="lockNote">-</div>
      </div>
      <div class="toolbar">
        <div>
          <label for="stocktakeKeyword">關鍵字搜尋</label>
          <input id="stocktakeKeyword" placeholder="輸入品名、位置、分類...">
        </div>
        <button class="btn btn-primary" id="searchBtn" type="button">重新載入</button>
        <button class="btn btn-secondary" id="refreshDiffBtn" type="button">重新計算差異</button>
      </div>
      <div class="row-actions" style="margin-top:12px;">
        <button class="btn btn-secondary" id="lockBtn" type="button">切換盤點鎖定</button>
        <button class="btn btn-success" id="reviewBtn" type="button">產生校正預覽</button>
        <button class="btn btn-danger" id="applyBtn" type="button">正式回寫校正</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">2. 差異摘要</div>
      <div class="summary-grid">
        <div class="summary-item"><div class="k">明細筆數</div><div class="v" id="sumCount">0</div></div>
        <div class="summary-item"><div class="k">盤盈筆數</div><div class="v" id="sumPlus">0</div></div>
        <div class="summary-item"><div class="k">盤虧筆數</div><div class="v" id="sumMinus">0</div></div>
        <div class="summary-item"><div class="k">待複核</div><div class="v" id="sumReview">0</div></div>
      </div>
      <label for="correctionReason">通用校正原因</label>
      <textarea id="correctionReason" rows="3" placeholder="例如：盤點人重算、移位未登錄、漏記、輸入錯誤"></textarea>
    </section>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:160px;">品名</th>
          <th style="width:120px;">位置</th>
          <th class="num" style="width:90px;">帳面量</th>
          <th class="num" style="width:110px;">實盤量</th>
          <th class="num" style="width:90px;">差異量</th>
          <th style="width:220px;">差異原因</th>
          <th style="width:130px;">校正狀態</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="padding:20px; color:#64748b; font-weight:700;">載入中...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="./gas-polyfill.js"></script>
  <script>
    const state = { items: [], locked: false, lockInfo: {} };

    function renderLockInfo() {
      const stateEl = document.getElementById('lockState');
      const noteEl = document.getElementById('lockNote');
      stateEl.textContent = state.locked ? '已鎖定' : '未鎖定';
      noteEl.textContent = state.lockInfo && state.lockInfo.note ? state.lockInfo.note : '-';
      document.getElementById('lockBtn').textContent = state.locked ? '解除盤點鎖定' : '開啟盤點鎖定';
    }

    function updateDiffForRow(row) {
      const actualInput = row.querySelector('[data-actual]');
      const diffCell = row.querySelector('[data-diff]');
      const statusCell = row.querySelector('[data-status]');
      const reasonInput = row.querySelector('[data-reason]');
      const bookQty = Number(row.getAttribute('data-book')) || 0;
      const actualQty = Number(actualInput.value) || 0;
      const diff = actualQty - bookQty;
      diffCell.textContent = String(diff);
      diffCell.className = 'num ' + (diff > 0 ? 'diff-plus' : diff < 0 ? 'diff-minus' : '');
      if (diff === 0) statusCell.textContent = '已校正';
      else if (Math.abs(diff) >= 10) statusCell.textContent = '待複核';
      else statusCell.textContent = diff > 0 ? '盤盈' : '盤虧';
      if (!reasonInput.value) reasonInput.value = document.getElementById('correctionReason').value || '';
    }

    function renderTable(items) {
      const box = document.getElementById('tableBody');
      if (!items || !items.length) {
        box.innerHTML = '<tr><td colspan="7" style="padding:20px; color:#64748b; font-weight:700;">沒有資料。</td></tr>';
        return;
      }
      box.innerHTML = items.map((item, idx) => `
        <tr data-book="${Number(item.bookQty) || 0}" data-id="${String(item.primaryId || '').replace(/"/g, '&quot;')}" data-name="${String(item.name || '').replace(/"/g, '&quot;')}" data-location="${String(item.location || '').replace(/"/g, '&quot;')}">
          <td><b>${item.name || ''}</b><br><small style="color:#64748b;">${item.category || ''} ${item.color || ''}</small></td>
          <td>${item.location || '-'}</td>
          <td class="num">${Number(item.bookQty) || 0}</td>
          <td class="num"><input data-actual type="number" min="0" step="1" value="${item.actualQty === '' ? (Number(item.bookQty) || 0) : item.actualQty}" style="width:100px; text-align:right;"></td>
          <td class="num" data-diff>0</td>
          <td><input data-reason type="text" placeholder="差異原因"></td>
          <td data-status>${item.adjustStatus || '待校正'}</td>
        </tr>
      `).join('');

      box.querySelectorAll('tr[data-book]').forEach(row => {
        row.querySelector('[data-actual]').addEventListener('input', () => updateDiffForRow(row));
        row.querySelector('[data-reason]').addEventListener('input', () => updateDiffForRow(row));
        updateDiffForRow(row);
      });
      recomputeSummary();
    }

    function recomputeSummary() {
      const rows = Array.from(document.querySelectorAll('tbody#tableBody tr[data-book]'));
      let plus = 0, minus = 0, review = 0;
      rows.forEach(row => {
        const diff = Number(row.querySelector('[data-diff]').textContent) || 0;
        const status = row.querySelector('[data-status]').textContent || '';
        if (diff > 0) plus++;
        else if (diff < 0) minus++;
        if (status === '待複核') review++;
      });
      document.getElementById('sumCount').textContent = String(rows.length);
      document.getElementById('sumPlus').textContent = String(plus);
      document.getElementById('sumMinus').textContent = String(minus);
      document.getElementById('sumReview').textContent = String(review);
    }

    function loadData() {
      const keyword = document.getElementById('stocktakeKeyword').value || '';
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="padding:20px; color:#64748b; font-weight:700;">載入中...</td></tr>';
      google.script.run.withSuccessHandler(res => {
        state.items = (res && res.items) || [];
        state.locked = !!(res && res.locked);
        state.lockInfo = (res && res.lockInfo) || {};
        renderLockInfo();
        const filtered = keyword ? state.items.filter(item => {
          const hay = [item.name, item.location, item.category, item.color].join(' ').toLowerCase();
          return hay.indexOf(keyword.toLowerCase()) > -1;
        }) : state.items;
        renderTable(filtered);
      }).withFailureHandler(err => {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="padding:20px; color:#dc2626; font-weight:700;">載入失敗：' + String(err || '') + '</td></tr>';
      }).getInventoryCorrectionData(true);
    }

    function toggleLock() {
      const nextLocked = !state.locked;
      const note = nextLocked ? '盤點進行中' : '盤點已結束';
      google.script.run.withSuccessHandler(res => {
        state.locked = !!(res && res.locked);
        state.lockInfo = { note: res && res.note ? res.note : note };
        renderLockInfo();
      }).setStocktakeLock(nextLocked, note);
    }

    function previewCorrection() {
      const changes = collectCorrectionRows();
      if (!changes.length) return alert('目前沒有差異，不需要回寫。');
      const lines = changes.slice(0, 10).map(item => {
        return `${item.name}: ${item.diff > 0 ? '+' : ''}${item.diff}`;
      });
      alert('校正預覽（前 10 筆）：\n\n' + lines.join('\n') + (changes.length > 10 ? '\n...' : ''));
    }

    function collectCorrectionRows() {
      const rows = Array.from(document.querySelectorAll('tbody#tableBody tr[data-book]'));
      const commonReason = String(document.getElementById('correctionReason').value || '').trim();
      return rows.map(row => {
        const bookQty = Number(row.getAttribute('data-book')) || 0;
        const actualQty = Math.max(0, Number(row.querySelector('[data-actual]').value) || 0);
        const diff = actualQty - bookQty;
        return {
          primaryId: String(row.getAttribute('data-id') || '').trim(),
          name: String(row.getAttribute('data-name') || '').trim(),
          location: String(row.getAttribute('data-location') || '').trim(),
          bookQty: bookQty,
          actualQty: actualQty,
          diff: diff,
          reason: String(row.querySelector('[data-reason]').value || commonReason || '').trim()
        };
      }).filter(item => item.diff !== 0);
    }

    function applyCorrection() {
      if (!state.locked) {
        alert('請先開啟盤點鎖定，再執行正式回寫。');
        return;
      }

      const changes = collectCorrectionRows();
      if (!changes.length) {
        alert('目前沒有差異，不需要回寫。');
        return;
      }

      const reason = String(document.getElementById('correctionReason').value || '').trim();
      if (!confirm(`將回寫 ${changes.length} 筆差異，確定執行？`)) return;

      const btn = document.getElementById('applyBtn');
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '回寫中...';

      google.script.run.withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = oldText;
        if (!res || !res.success) {
          const msg = (res && res.message) ? res.message : '回寫失敗';
          return alert(msg);
        }
        const failedCount = Number(res.failedCount) || 0;
        let msg = `完成：成功 ${Number(res.updatedCount) || 0} 筆`;
        if (failedCount > 0) msg += `，失敗 ${failedCount} 筆`;
        alert(msg);
        loadData();
      }).withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = oldText;
        alert('回寫失敗：' + String(err || ''));
      }).applyStocktakeCorrections({ rows: changes, reason: reason });
    }

    window.addEventListener('load', () => {
      document.getElementById('topNav').innerHTML = `
        <a href="index.html" target="_top">🏠 主選單</a>
        <a href="inventory.html" target="_top">📊 總覽</a>
        <a href="transfer.html" target="_top">↔️ 移轉</a>
        <a href="stocktake-correction.html" target="_top" class="active">🧾 盤點校正</a>
      `;

      loadData();
      document.getElementById('searchBtn').addEventListener('click', loadData);
      document.getElementById('refreshDiffBtn').addEventListener('click', () => {
        document.querySelectorAll('tbody#tableBody tr[data-book]').forEach(row => updateDiffForRow(row));
        recomputeSummary();
      });
      document.getElementById('lockBtn').addEventListener('click', toggleLock);
      document.getElementById('reviewBtn').addEventListener('click', previewCorrection);
      document.getElementById('applyBtn').addEventListener('click', applyCorrection);
      document.getElementById('stocktakeKeyword').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadData();
        }
      });
      document.getElementById('correctionReason').addEventListener('input', () => {
        document.querySelectorAll('tbody#tableBody tr[data-book]').forEach(row => updateDiffForRow(row));
      });
    });
  </script>
</body>
</html>
